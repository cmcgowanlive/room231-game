<!doctype html><html><head><meta charset="utf-8"><title>Room 231 QR Sheet</title><style>body{font:16px system-ui;margin:20px;background:#f6f1e9}input{font:inherit;padding:12px;width:min(680px,95%)}button{padding:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #888;text-align:center;padding:12px;break-inside:avoid}.card img{width:170px;max-width:100%}h1{font:32px Georgia}@media print{.controls{display:none}.grid{gap:4px}.card{padding:6px}body{margin:5px}}</style></head><body><div class="controls"><h1>Room 231 — Printable QR Cards</h1><p>Enter the live website URL AFTER publishing. The page generates 16 route-start codes and 22 station codes. Printing requires an internet connection to retrieve QR images from the public QR service.</p><input id="base" placeholder="https://YOUR-USERNAME.github.io/room231/"><button id="go">Generate cards</button><button onclick="window.print()">Print / Save as PDF</button></div><div id="cards"></div><script>const groups=['RED','BLUE','GREEN','YELLOW'];const locs=['Cross Walk Button','Small Water Fountain','Patio Stairwell','Service Door','Garage Door','Service Elevator','Mailbox','Lady in White Statue','Large Water Fountain','City Directory','Dancing Couple Statue','Ballroom','Prefunction','Rotunda','Service Closet','Fultons','Elevators','Carries','Front Desk','Main Entrance','Valet Entrance','Main Lobby'];document.getElementById('go').onclick=()=>{let base=document.getElementById('base').value.trim();if(!/^https:\/\//.test(base)){alert('Enter the real published HTTPS address first');return}let u=new URL(base),items=[];for(let g of groups)for(let i=1;i<=4;i++)items.push(['START '+g+'-'+i,'route',g+'-'+i]);for(let l of locs)items.push(['STATION '+l,'station',l]);document.getElementById('cards').innerHTML='<h1>16 Route Start Codes</h1><div class="grid">'+items.map((x,i)=>{let url=new URL(u);url.searchParams.set(x[1],x[2]);return (i===16?'</div><h1>22 Shared Station Codes</h1><div class="grid">':'')+'<div class="card"><b>'+x[0]+'</b><br><img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(url.toString())+'"><br><small>'+x[2]+'</small></div>'}).join('')+'</div>'};</script></body></html>
