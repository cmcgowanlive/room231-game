<!doctype html><html><head><meta charset="utf-8"><title>Room 231 Organizer Setup</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:12px;background:#f7f0e5;color:#21180e}label{display:block;margin:10px 0}input,select,textarea{font:inherit;padding:7px;width:100%}textarea{height:100px}button{font:inherit;padding:12px;background:#33231a;color:white;border:0;cursor:pointer}section{border:1px solid #bda88d;padding:15px;margin:15px 0}h1,h2{font-family:Georgia}</style></head><body><h1>Room 231 — Organizer Setup</h1><p>Upload the game-data.json file from the website folder. Assign approved physical locations and paste approved evidence texts. Download the updated file and replace game-data.json in the website folder before publishing. This editor works offline.</p><input id="file" type="file" accept=".json"><div id="editor"></div><script>let d;const names=['Cross Walk Button','Small Water Fountain','Patio Stairwell','Service Door','Garage Door','Service Elevator','Mailbox','Lady in White Statue','Large Water Fountain','City Directory','Dancing Couple Statue','Ballroom','Prefunction','Rotunda','Service Closet','Fultons','Elevators','Carries','Front Desk','Main Entrance','Valet Entrance','Main Lobby'];document.getElementById('file').onchange=async e=>{d=JSON.parse(await e.target.files[0].text());let out='<section><h2>Evidence and stations</h2>';for(let i=1;i<=20;i++){let id='E'+String(i).padStart(2,'0');out+=`<label><b>${id} location</b><select data-loc="${id}"><option value="">Not assigned</option>${names.map(n=>`<option ${d.assignments[id]===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${id} approved evidence text<textarea data-ev="${id}"></textarea></label>`}out+='</section><section><h2>Final unlock</h2><label>Approved four-digit code<input id="finalCode" maxlength="4" inputmode="numeric"></label><label>Approved Evidence 21 letter<textarea id="finalLetter" style="height:220px"></textarea></label></section><button id="download">Download updated game-data.json</button>';document.getElementById('editor').innerHTML=out;document.querySelectorAll('[data-ev]').forEach(x=>x.value=d.evidenceText[x.dataset.ev]||'');document.getElementById('finalCode').value=d.finalCode||'';document.getElementById('finalLetter').value=d.finalLetter||'';document.getElementById('download').onclick=()=>{document.querySelectorAll('[data-loc]').forEach(x=>d.assignments[x.dataset.loc]=x.value);document.querySelectorAll('[data-ev]').forEach(x=>d.evidenceText[x.dataset.ev]=x.value);d.finalCode=document.getElementById('finalCode').value;d.finalLetter=document.getElementById('finalLetter').value;let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='game-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}};</script></body></html>
